[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["enterpriseengine-environments[lake]"]

[tool.uv.sources]
enterpriseengine-environments = { workspace = true }

[tool.ruff]
target-version = "py310"
line-length = 120
include = ["packages/**/*.py", "contracts/**/*.py", "scripts/**/*.py"]
# PR #52 is changing the swarm runner scripts.
extend-exclude = ["scripts/swarm"]
force-exclude = true

[tool.ruff.per-file-target-version]
# These existing modules already use Python 3.11 syntax or ExceptionGroup.
"packages/environments/src/environments/consumers/extraction.py" = "py311"
"**/norvale/integrations/lake/boundary.py" = "py311"
"**/norvale/integrations/company_run/lake.py" = "py311"
"**/norvale/integrations/company_run/test_planning_report.py" = "py311"
"**/norvale/integrations/lake/plm_reader.py" = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter sets the width. Leave long literals and comments intact.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Odoo loads add-on modules in declaration order.
"**/norvale_mes/__init__.py" = ["F401", "I001"]

# Odoo loads manifests as dictionary expressions.
"**/norvale/integrations/**/__manifest__.py" = ["B018"]

# Preserve existing import bindings, callback scopes, and runtime behavior.
"contracts/test_company_erp.py" = ["F841"]
"contracts/test_consumer_invariants.py" = ["E402"]
"contracts/test_engine_goals.py" = ["B007", "B023", "B905"]
