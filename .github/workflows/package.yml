name: Package release gate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: uvx --from ruff==0.17.6 ruff check
      - run: uvx --from ruff==0.17.6 ruff format --check

  installed-wheel:
    name: Installed wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash scripts/check_release.sh

  workspace:
    name: Offline workspace tests
    if: github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NORVALE_OFFLINE: '1'
      NORVALE_RELEASE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked --all-packages
      - run: uv run --offline python scripts/check_versions.py
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --offline python scripts/check_versions.py --base "$BASE_SHA"
      - run: uv run --no-sync --offline python scripts/check_imports.py
      - run: uv run --no-sync --offline python -m unittest discover -s scripts/swarm/tests
      - run: uv run --no-sync --offline python -m unittest discover -s packages/engine/tests
      - run: uv run --no-sync --offline python -m unittest discover -s contracts
      - run: uv run --no-sync --offline python -m unittest discover -s packages/environments/src/environments/norvale/integrations -t packages/environments/src
