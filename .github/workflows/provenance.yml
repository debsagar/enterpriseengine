name: Contribution provenance

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: provenance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provenance:
    name: PR provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate PR metadata
        shell: bash
        run: |
          if git show HEAD^1:scripts/swarm/provenance.py > "$RUNNER_TEMP/provenance.py" 2>/dev/null; then
            python3 "$RUNNER_TEMP/provenance.py"
          else
            python3 scripts/swarm/provenance.py
          fi
