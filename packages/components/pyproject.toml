[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterpriseengine-components"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["enterpriseengine>=0.3.0"]

[tool.uv.sources]
enterpriseengine = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
