[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterpriseengine-components"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["enterpriseengine>=0.3.0"]

[tool.uv.sources]
enterpriseengine = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
